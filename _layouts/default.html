<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
<meta name="theme-color" content="#110c30">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&amp;family=Fragment+Mono:ital@0;1&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body id="top">

<a class="skip" href="#main">Skip to content</a>

{% if page.hero %}{% include hero.html %}{% else %}{% include masthead.html %}{% endif %}
<div class="edge" aria-hidden="true"></div>

{% include nav.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<dialog class="lightbox" id="lightbox" aria-label="Enlarged figure">
  <button class="lb-close" type="button" aria-label="Close">×</button>
  <img alt="">
</dialog>

<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
